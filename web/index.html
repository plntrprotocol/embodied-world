<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Sound — Embodied Creative World</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1612;--bg-panel:#241e18;--bg-input:#2d241c;--text:#d4c5a9;--text-dim:#8a7d6c;--text-bright:#f0e6d0;--accent:#c4956a;--accent-dim:#8a6940;--border:#3d3228;--success:#7a9a6a;--danger:#a06060;--font:'Georgia','Times New Roman',serif;--font-mono:'Courier New',monospace}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:1fr auto;height:100vh}
#view{position:relative;background:#000;overflow:hidden;border-right:1px solid var(--border)}
#world-canvas{width:100%;height:100%;display:block}
#location-name{position:absolute;top:16px;left:20px;font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;pointer-events:none}
#time-weather{position:absolute;top:16px;right:20px;text-align:right;font-size:12px;color:var(--text-dim);pointer-events:none}
#exits-overlay{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:80%;pointer-events:none}
.exit-btn{pointer-events:auto;background:rgba(36,30,24,0.85);border:1px solid var(--border);color:var(--text);padding:4px 12px;font-family:var(--font);font-size:12px;cursor:pointer;border-radius:3px;transition:all 0.15s}
.exit-btn:hover{background:rgba(196,149,106,0.2);border-color:var(--accent);color:var(--text-bright)}
#npcs-overlay{position:absolute;bottom:16px;left:20px;display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
.npc-chip{background:rgba(36,30,24,0.8);border:1px solid var(--border);color:var(--text-dim);padding:3px 10px;font-size:11px;border-radius:10px;cursor:pointer;transition:all 0.15s}
.npc-chip:hover{border-color:var(--accent);color:var(--text)}
#sidebar{display:flex;flex-direction:column;background:var(--bg-panel);border-left:1px solid var(--border);overflow:hidden}
#description{flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#description::-webkit-scrollbar{width:6px}
#description::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#status-bar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;background:var(--border);border-top:1px solid var(--border)}
.stat{background:var(--bg-panel);padding:6px 8px;text-align:center}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)}
.stat-value{font-size:13px;color:var(--text-bright);margin-top:2px}
.stat-bar{height:3px;background:var(--bg-input);margin-top:4px;border-radius:2px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:2px;transition:width 0.5s ease}
.stat-bar-fill.energy{background:#c4956a}.stat-bar-fill.hunger{background:#a06060}
.stat-bar-fill.warmth{background:#6a8aaa}.stat-bar-fill.mood{background:#7a9a6a}
#input-bar{grid-column:1/-1;display:flex;align-items:center;background:var(--bg-input);border-top:1px solid var(--border);padding:8px 16px;gap:8px}
#prompt{color:var(--accent);font-family:var(--font-mono);font-size:14px;white-space:nowrap}
#cmd-input{flex:1;background:transparent;border:none;color:var(--text-bright);font-family:var(--font);font-size:14px;outline:none;caret-color:var(--accent)}
#cmd-input::placeholder{color:var(--text-dim);opacity:0.5}
#quick-actions{display:flex;gap:4px}
.q-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:4px 8px;font-family:var(--font);font-size:11px;cursor:pointer;border-radius:3px;transition:all 0.15s}
.q-btn:hover{border-color:var(--accent);color:var(--text)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:40vh 1fr auto}#view{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="world-canvas"></canvas>
    <div id="location-name">Loading...</div>
    <div id="time-weather"></div>
    <div id="exits-overlay"></div>
    <div id="npcs-overlay"></div>
  </div>
  <div id="sidebar">
    <div id="description">Loading the world...</div>
    <div id="status-bar">
      <div class="stat"><div class="stat-label">Energy</div><div class="stat-value" id="stat-energy">—</div><div class="stat-bar"><div class="stat-bar-fill energy" id="bar-energy" style="width:0%"></div></div></div>
      <div class="stat"><div class="stat-label">Hunger</div><div class="stat-value" id="stat-hunger">—</div><div class="stat-bar"><div class="stat-bar-fill hunger" id="bar-hunger" style="width:0%"></div></div></div>
      <div class="stat"><div class="stat-label">Warmth</div><div class="stat-value" id="stat-warmth">—</div><div class="stat-bar"><div class="stat-bar-fill warmth" id="bar-warmth" style="width:0%"></div></div></div>
      <div class="stat"><div class="stat-label">Mood</div><div class="stat-value" id="stat-mood">—</div><div class="stat-bar"><div class="stat-bar-fill mood" id="bar-mood" style="width:0%"></div></div></div>
    </div>
  </div>
  <div id="input-bar">
    <span id="prompt">&gt;</span>
    <input type="text" id="cmd-input" placeholder="What do you do?" autocomplete="off" autofocus>
    <div id="quick-actions">
      <button class="q-btn" data-cmd="look">Look</button>
      <button class="q-btn" data-cmd="feel">Feel</button>
      <button class="q-btn" data-cmd="advance">Wait</button>
      <button class="q-btn" data-cmd="status">Status</button>
    </div>
  </div>
</div>

<script>
const state={locationId:'',locationName:'',description:'',time:{},weather:{},body:{},internal:{},exits:[],npcs:[],ecology:null,events:[],commandHistory:[],historyIndex:-1};
const canvas=document.getElementById('world-canvas');
const ctx=canvas.getContext('2d');
let animFrame=0;
let particles=[];
function resizeCanvas(){canvas.width=canvas.clientWidth*window.devicePixelRatio;canvas.height=canvas.clientHeight*window.devicePixelRatio;ctx.scale(window.devicePixelRatio,window.devicePixelRatio)}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
class Particle{constructor(type){this.reset(type)}reset(type){this.x=Math.random()*canvas.clientWidth;this.y=-10;this.speed=type==='rain'?4+Math.random()*3:type==='snow'?1+Math.random():2;this.size=type==='rain'?1.5:type==='snow'?3:1;this.opacity=0.3+Math.random()*0.4;this.wind=type==='snow'?(Math.random()-0.5)*2:0}update(type){this.y+=this.speed;this.x+=this.wind;if(this.y>canvas.clientHeight)this.reset(type)}draw(type){ctx.globalAlpha=this.opacity;if(type==='rain'){ctx.strokeStyle='#8aaaba';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-1,this.y+8);ctx.stroke()}else if(type==='snow'){ctx.fillStyle='#d4d4e0';ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill()}else if(type==='fog'){ctx.fillStyle='rgba(180,180,190,0.03)';ctx.beginPath();ctx.arc(this.x,this.y,30+Math.random()*20,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}}
function initParticles(weather){particles=[];const c=weather==='rain'?80:weather==='storm'?150:weather==='snow'?60:weather==='fog'?20:0;for(let i=0;i<c;i++)particles.push(new Particle(weather))}
function getSkyColors(){const t=state.time.time_of_day||'morning';const w=state.weather.condition||'clear';const s={clear:{dawn:['#2a1a3a','#8a6a5a','#d4a060'],morning:['#3a5a7a','#6a8aaa','#aacaea'],midday:['#4a8aaa','#90c0e0','#d8eaf8'],afternoon:['#4a7a9a','#8abaca','#d0e4f0'],evening:['#3a2a4a','#8a5a40','#d49050'],night:['#0a0a1a','#1a1a2a','#2a2a3a'],deep_night:['#050510','#0a0a1a','#15152a']},cloudy:{dawn:['#2a2a3a','#5a5a6a','#8a8a7a'],morning:['#4a4a5a','#6a6a7a','#9a9aaa'],midday:['#5a5a6a','#7a7a8a','#aaaaaa'],evening:['#3a3a4a','#6a5a5a','#9a8a7a'],night:['#1a1a2a','#2a2a3a','#3a3a4a'],default:['#4a4a5a','#6a6a7a','#9a9aaa']},foggy:{default:['#6a6a60','#8a8a7a','#a0a090']},rain:{dawn:['#1a1a2a','#3a3a4a','#5a5a5a'],morning:['#2a2a3a','#4a4a5a','#6a6a6a'],midday:['#3a3a4a','#5a5a6a','#7a7a7a'],evening:['#1a1a2a','#3a3a3a','#5a5a5a'],night:['#0a0a1a','#1a1a2a','#2a2a2a'],default:['#2a2a3a','#4a4a5a','#6a6a6a']},storm:{default:['#0a0a1a','#1a1a2a','#2a3a3a']}};const ws=s[w]||s.clear;return ws[t]||ws.default||ws.midday||['#3a5a7a','#6a8aaa','#aacaea']}
function drawSky(pct){const sky=getSkyColors();const g=ctx.createLinearGradient(0,0,0,canvas.clientHeight*(pct||0.5));g.addColorStop(0,sky[0]);g.addColorStop(0.5,sky[1]);g.addColorStop(1,sky[2]);ctx.fillStyle=g;ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight*(pct||0.5))}
function drawWater(y){const g=ctx.createLinearGradient(0,y,0,canvas.clientHeight);g.addColorStop(0,'#2a4a5a');g.addColorStop(1,'#1a3a4a');ctx.fillStyle=g;ctx.fillRect(0,y,canvas.clientWidth,canvas.clientHeight-y);ctx.strokeStyle='rgba(150,180,200,0.2)';ctx.lineWidth=1;for(let i=0;i<5;i++){ctx.beginPath();for(let x=0;x<canvas.clientWidth;x+=2){const wy=y+i*12+Math.sin((x+animFrame*0.4+i*20)*0.02)*3;if(x===0)ctx.moveTo(x,wy);else ctx.lineTo(x,wy)}ctx.stroke()}}
function drawLiveOak(tx,th,cr){ctx.fillStyle='#3a2a1a';ctx.fillRect(tx-5,canvas.clientHeight*0.55-th*0.6,10,th*0.6);ctx.fillStyle='rgba(40,60,30,0.8)';ctx.beginPath();ctx.arc(tx,canvas.clientHeight*0.55-th*0.6-10,cr,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(50,80,35,0.6)';ctx.beginPath();ctx.arc(tx-cr*0.4,canvas.clientHeight*0.55-th*0.6-5,cr*0.7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(tx+cr*0.4,canvas.clientHeight*0.55-th*0.6-8,cr*0.6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(150,160,130,0.4)';ctx.lineWidth=1;for(let m=0;m<8;m++){ctx.beginPath();ctx.moveTo(tx-cr*0.8+m*cr*0.2,canvas.clientHeight*0.55-th*0.6);ctx.quadraticCurveTo(tx-cr*0.8+m*cr*0.2+Math.sin(animFrame*0.005+m)*2,canvas.clientHeight*0.55-th*0.6+15,tx-cr*0.8+m*cr*0.2,canvas.clientHeight*0.55-th*0.6+25);ctx.stroke()}}

function getLocationScene(){
const loc=state.locationId||'cottage_bedroom',season=state.time.season||'spring',tod=state.time.time_of_day||'morning',weather=state.weather.condition||'clear',isNight=(tod==='night'||tod==='deep_night'),w=canvas.clientWidth,h=canvas.clientHeight;

if(loc==='cottage_main_room')return(ctx)=>{ctx.fillStyle='#3a2a1a';ctx.fillRect(0,h*0.65,w,h*0.35);ctx.fillStyle='#2a1a10';ctx.fillRect(0,h*0.1,w,h*0.55);ctx.fillStyle=isNight?'#1a1a2a':'#3a4a5a';ctx.fillRect(w*0.55,h*0.15,w*0.18,h*0.3);ctx.strokeStyle='#4a3a2a';ctx.lineWidth=3;ctx.strokeRect(w*0.55,h*0.15,w*0.18,h*0.3);ctx.beginPath();ctx.moveTo(w*0.64,h*0.15);ctx.lineTo(w*0.64,h*0.45);ctx.moveTo(w*0.55,h*0.3);ctx.lineTo(w*0.73,h*0.3);ctx.stroke();ctx.fillStyle='#5a4a3a';ctx.fillRect(w*0.08,h*0.3,w*0.2,h*0.35);ctx.fillStyle='#1a1a1a';ctx.fillRect(w*0.12,h*0.38,w*0.12,h*0.25);const f=Math.sin(animFrame*0.1)*0.1+0.9;ctx.fillStyle='rgba(200,100,40,'+(f*0.6)+')';ctx.beginPath();ctx.arc(w*0.18,h*0.55,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(250,180,60,'+(f*0.4)+')';ctx.beginPath();ctx.arc(w*0.18,h*0.55,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5a4a3a';ctx.fillRect(w*0.35,h*0.55,w*0.2,h*0.12);ctx.fillStyle='#4a3a2a';ctx.fillRect(w*0.35,h*0.5,w*0.2,h*0.08);ctx.fillStyle='#3a4a3a';ctx.fillRect(w*0.48,h*0.5,w*0.06,h*0.08);ctx.fillStyle='#5a4a30';ctx.fillRect(w*0.42,h*0.62,w*0.08,h*0.04);ctx.fillStyle='#4a3a20';ctx.fillRect(w*0.44,h*0.66,w*0.02,h*0.08);ctx.fillStyle='#4a3a20';ctx.fillRect(w*0.78,h*0.2,w*0.03,h*0.45);ctx.fillRect(w*0.92,h*0.2,w*0.03,h*0.45);for(let r=0;r<4;r++){ctx.fillStyle='#5a4a30';ctx.fillRect(w*0.78,h*0.22+r*0.11,w*0.17,h*0.02);for(let c=0;c<3;c++){ctx.fillStyle=['#6a5a4a','#5a6a5a','#7a6a5a'][c];ctx.fillRect(w*0.8+c*0.05,h*0.18+r*0.11,w*0.03,h*0.04)}}ctx.strokeStyle='#6a5a4a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w*0.02,h*0.7);ctx.lineTo(w*0.08,h*0.15);ctx.stroke();ctx.beginPath();ctx.moveTo(w*0.05,h*0.7);ctx.lineTo(w*0.12,h*0.18);ctx.stroke()};

if(loc==='cottage_bedroom')return(ctx)=>{ctx.fillStyle='#3a2a1a';ctx.fillRect(0,h*0.65,w,h*0.35);ctx.fillStyle='#2a1a10';ctx.fillRect(0,h*0.1,w,h*0.55);ctx.fillStyle=isNight?'#1a1a2a':'#3a4a5a';ctx.fillRect(w*0.55,h*0.15,w*0.2,h*0.3);ctx.strokeStyle='#4a3a2a';ctx.lineWidth=3;ctx.strokeRect(w*0.55,h*0.15,w*0.2,h*0.3);ctx.beginPath();ctx.moveTo(w*0.65,h*0.15);ctx.lineTo(w*0.65,h*0.45);ctx.moveTo(w*0.55,h*0.3);ctx.lineTo(w*0.75,h*0.3);ctx.stroke();ctx.fillStyle='#4a3a2a';ctx.fillRect(w*0.1,h*0.5,w*0.3,h*0.2);ctx.fillStyle='#6a5a4a';ctx.fillRect(w*0.12,h*0.48,w*0.26,h*0.05);ctx.fillStyle='#5a4a5a';ctx.fillRect(w*0.11,h*0.53,w*0.28,h*0.14);ctx.fillStyle='#4a5a4a';ctx.fillRect(w*0.15,h*0.55,w*0.06,h*0.04);ctx.fillStyle='#6a5a4a';ctx.fillRect(w*0.25,h*0.55,w*0.06,h*0.04);ctx.fillStyle='#3a3a2a';ctx.fillRect(w*0.1,h*0.72,w*0.15,h*0.08);ctx.fillStyle='#5a5a4a';ctx.fillRect(w*0.12,h*0.73,w*0.11,h*0.02);ctx.fillStyle='#5a4a30';ctx.fillRect(w*0.35,h*0.55,w*0.15,h*0.04);ctx.fillStyle='#4a3a20';ctx.fillRect(w*0.37,h*0.59,w*0.02,h*0.1);ctx.fillRect(w*0.46,h*0.59,w*0.02,h*0.1);ctx.fillStyle='#2a2a2a';ctx.fillRect(w*0.38,h*0.52,w*0.06,h*0.03);ctx.fillStyle='#6a5a4a';ctx.fillRect(w*0.44,h*0.5,w*0.03,h*0.04)};

if(loc==='cottage_kitchen')return(ctx)=>{ctx.fillStyle='#3a2a1a';ctx.fillRect(0,h*0.65,w,h*0.35);ctx.fillStyle='#2a1a10';ctx.fillRect(0,h*0.1,w,h*0.55);ctx.fillStyle=isNight?'#1a1a2a':'#4a5a4a';ctx.fillRect(w*0.55,h*0.15,w*0.15,h*0.25);ctx.strokeStyle='#4a3a2a';ctx.lineWidth=2;ctx.strokeRect(w*0.55,h*0.15,w*0.15,h*0.25);ctx.fillStyle='#3a3a3a';ctx.fillRect(w*0.1,h*0.4,w*0.15,h*0.25);ctx.fillStyle='#2a2a2a';ctx.fillRect(w*0.13,h*0.42,w*0.09,h*0.1);ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(w*0.18,h*0.5,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5a5a5a';ctx.fillRect(w*0.55,h*0.45,w*0.15,h*0.08);ctx.fillStyle='#4a3a20';ctx.fillRect(w*0.75,h*0.2,w*0.03,h*0.4);ctx.fillRect(w*0.88,h*0.2,w*0.03,h*0.4);for(let r=0;r<3;r++){ctx.fillStyle='#5a4a30';ctx.fillRect(w*0.75,h*0.25+r*0.12,w*0.16,h*0.02);for(let c=0;c<4;c++){ctx.fillStyle=['#6a8a5a','#8a5a4a','#5a6a8a','#8a8a5a'][c];ctx.fillRect(w*0.77+c*0.035,h*0.22+r*0.12,w*0.02,h*0.03)}}ctx.fillStyle='rgba(180,140,80,0.5)';ctx.fillRect(w*0.35,h*0.5,w*0.04,h*0.08);ctx.fillStyle='#8a7a5a';ctx.fillRect(w*0.34,h*0.48,w*0.06,h*0.03)};

return(ctx)=>{ctx.fillStyle='#1a1612';ctx.fillRect(0,0,w,h);ctx.fillStyle='#8a7d6c';ctx.font='14px Georgia';ctx.textAlign='center';ctx.fillText('Unknown: '+loc,w/2,h/2)};
}

// ── RENDER LOOP ──
function render(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const weather=state.weather.condition||'clear';
  ctx.clearRect(0,0,w,h);
  const scene=getLocationScene();
  if(typeof scene==='function')scene(ctx);
  if(weather==='fog'){ctx.fillStyle='rgba(180,180,190,0.12)';ctx.fillRect(0,0,w,h)}
  if(weather==='rain'||weather==='storm'){ctx.fillStyle='rgba(100,120,140,0.06)';ctx.fillRect(0,0,w,h)}
  particles.forEach(p=>{p.update(weather);p.draw(weather)});
  const vg=ctx.createRadialGradient(w/2,h/2,w*0.3,w/2,h/2,w*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
  animFrame++;requestAnimationFrame(render);
}

// ── API & UI ──
async function apiGet(path){try{const r=await fetch('/api'+path);return await r.json()}catch(e){return null}}
async function apiPost(path,data={}){try{const r=await fetch('/api'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return await r.json()}catch(e){return null}}

function updateUI(){
  const desc=document.getElementById('description');
  if(state.description){desc.textContent=state.description;desc.classList.add('fade-in')}
  const ln=document.getElementById('location-name');if(state.locationName)ln.textContent=state.locationName;
  const tw=document.getElementById('time-weather');
  if(state.time&&state.weather){const s=(state.time.season||'').charAt(0).toUpperCase()+(state.time.season||'').slice(1);tw.innerHTML=s+', '+(state.time.time_of_day||'').replace(/_/g,' ')+'<br>'+(state.weather.condition||'')+', '+(state.weather.temperature||'?')+'°C'}
  if(state.body){const e=Math.round((state.body.energy||0)*100),hu=Math.round((state.body.hunger||0)*100),wa=Math.round((state.body.warmth||0)*100);document.getElementById('stat-energy').textContent=e+'%';document.getElementById('stat-hunger').textContent=hu+'%';document.getElementById('stat-warmth').textContent=wa+'%';document.getElementById('bar-energy').style.width=e+'%';document.getElementById('bar-hunger').style.width=hu+'%';document.getElementById('bar-warmth').style.width=wa+'%'}
  if(state.internal){const m=state.internal.mood||state.body?.mood||'—';document.getElementById('stat-mood').textContent=m;const mv=['content','peaceful','grateful','inspired','excited','curious'].includes(m)?80:['calm','awake'].includes(m)?50:['restless','melancholy','bored','frustrated'].includes(m)?30:['tired','hungry','cold','thirsty','lonely'].includes(m)?15:50;document.getElementById('bar-mood').style.width=mv+'%'}
  const ed=document.getElementById('exits-overlay');ed.innerHTML='';
  state.exits.forEach(ex=>{const b=document.createElement('button');b.className='exit-btn';b.textContent=ex.direction;b.title=ex.description;b.onclick=()=>sendCommand('move '+ex.direction);ed.appendChild(b)});
  const nd=document.getElementById('npcs-overlay');nd.innerHTML='';
  state.npcs.forEach(n=>{const c=document.createElement('button');c.className='npc-chip';c.textContent=n.name;c.onclick=()=>sendCommand('talk '+n.name);nd.appendChild(c)});
}

async function sendCommand(input){
  const parts=input.trim().split(/\s+/);const action=parts[0].toLowerCase();const target=parts.slice(1).join(' ')||null;
  state.commandHistory.push(input);state.historyIndex=-1;
  const result=await apiPost('/action',{action,target});
  if(result&&result.result)state.description=result.result;
  await refreshWorld();updateUI();
}

async function refreshWorld(){
  const [wd,ld,sd,ed,nd]=await Promise.all([apiGet('/world'),apiGet('/location'),apiGet('/status'),apiGet('/exits'),apiGet('/npcs')]);
  if(wd){state.time=wd.time||{};state.weather=wd.weather||{};state.body=wd.body||{};state.internal=wd.internal||{};const owl=wd.agents?.owl||{};state.locationId=owl.location_id||'cottage_bedroom';const loc=wd.locations?.[state.locationId]||{};state.locationName=loc.name||'Unknown'}
  if(ld){state.description=ld.description||state.description;state.locationId=ld.location_id||state.locationId}
  if(sd){state.body={...state.body,...sd.body};state.internal={...state.internal,...sd.internal};state.time={...state.time,...sd.time};state.weather={...state.weather,...sd.weather}}
  if(ed)state.exits=ed.exits||[];
  if(nd)state.npcs=nd.npcs||[];
}

const cmdInput=document.getElementById('cmd-input');
cmdInput.addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&cmdInput.value.trim()){const c=cmdInput.value.trim();cmdInput.value='';await sendCommand(c)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(state.commandHistory.length>0){state.historyIndex=Math.min(state.historyIndex+1,state.commandHistory.length-1);cmdInput.value=state.commandHistory[state.commandHistory.length-1-state.historyIndex]}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(state.historyIndex>0){state.historyIndex--;cmdInput.value=state.commandHistory[state.commandHistory.length-1-state.historyIndex]}else{state.historyIndex=-1;cmdInput.value=''}}
});
document.querySelectorAll('.q-btn').forEach(b=>b.addEventListener('click',()=>sendCommand(b.dataset.cmd)));
document.addEventListener('keydown',e=>{if(e.target===cmdInput)return;if(e.key==='/'||e.key==='i'){e.preventDefault();cmdInput.focus()}});

async function init(){await refreshWorld();updateUI();initParticles(state.weather.condition||'clear');render();setInterval(async()=>{const old=state.weather.condition;await refreshWorld();if(state.weather.condition!==old)initParticles(state.weather.condition);updateUI()},5000)}
init();
</script>
</body>
